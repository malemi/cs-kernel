[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-kernel"
version = "0.9.6"
description = "Shared kernel of the <company>-cs customer-service operators: import package `cs` (frozen module path), per-company variance declared in the clone's manifest.toml."
license = { text = "MIT" }
requires-python = ">=3.11"
# Dependencies = the specimens' requirements.txt, unchanged.
dependencies = [
    "pydantic-settings>=2.2",
    "firebase-admin>=6.5",
    "websockets>=13",
    "google-auth>=2.29",
    "requests>=2.31",
    "jinja2>=3.1",
    # The client for kernel-owned LLM calls. NOT optional (it was, until
    # 2026-08-21, and was documented nowhere a reader would look): the send
    # guard's register judgment calls `worker_llm.classify` on the
    # model-composed send path, so an install without this ran a SAFETY
    # check in degraded mode and said so only in a log line. A dependency
    # a safety path reaches for is a dependency, not an extra.
    "anthropic>=0.107",
]

# Kernel-owned LLM calls (cs/worker_llm.py) need the anthropic SDK — which is
# also the OpenRouter / gateway client, since they speak the same wire. It is an
# EXTRA, not a hard dependency: a clone that never makes a kernel-side LLM call
# should not grow one, and worker_llm imports it lazily so every other verb
# still works without it. Install with `pip install "cs-kernel[llm]"`.
[project.optional-dependencies]
# Retained as a no-op alias so any `cs-kernel[llm]` install line still
# resolves; the dependency it used to add is now a base dependency.
llm = []

# The README has always described `cs` as a command ("After `cs init`, you
# have:", "skills → cs CLI"). Until now only `python -m cs` existed, so the
# document and the package described two different products. This makes the
# better of the two true. It does not touch the frozen module path: the entry
# point is a second door onto the same `cs.cli:main` that `cs/__main__.py`
# already calls.
#
# CAUTION for the clones: permission rules match command TEXT, not behavior,
# so every rule must enumerate every spelling that reaches this entry point.
# The kernel templates do: deny sets carry six spellings (python/python3,
# venv-prefixed and bare, module path and console script), the allow list the
# four canonical ones. tests/run.sh gates the deny enumeration. After a clone
# re-pins, confirm the rendered .claude/settings.json and
# bin/cs_operator_cron.sh actually carry the enumerated entries before
# un-pausing the operators (cs update applies these two security-critical
# files on conflict, saving the local version as *.local-bak; other local
# edits are kept).
[project.scripts]
cs = "cs.cli:main"

[tool.setuptools.packages.find]
include = ["cs*"]

# Ship Jinja project templates with the package (cs init / cs update).
# NOTE: `**/*` does NOT match dot-prefixed files/dirs, so the hidden templates
# (.claude/, .env.example.j2, .gitignore.j2) must be listed explicitly — without
# them a stamped clone is missing its skills/commands/settings + .env/.gitignore.
[tool.setuptools.package-data]
cs = [
    "templates/project/**/*",
    "templates/project/.*",
    "templates/project/.claude/**/*",
    # Stamped per project by `cs project new`, NOT once per clone by `cs init` —
    # hence a template root of its own, which needs its own glob here or the
    # verb ships without its templates and fails on a clean install.
    "templates/project_memory/**/*",
]
