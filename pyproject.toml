[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-kernel"
version = "0.3.7"
description = "Shared kernel of the <company>-cs customer-service operators: import package `cs` (frozen module path), per-company variance declared in the clone's manifest.toml."
license = { text = "MIT" }
requires-python = ">=3.11"
# Dependencies = the specimens' requirements.txt, unchanged.
dependencies = [
    "pydantic-settings>=2.2",
    "firebase-admin>=6.5",
    "websockets>=13",
    "google-auth>=2.29",
    "requests>=2.31",
    "jinja2>=3.1",
]

# Kernel-owned LLM calls (cs/worker_llm.py) need the anthropic SDK — which is
# also the OpenRouter / gateway client, since they speak the same wire. It is an
# EXTRA, not a hard dependency: a clone that never makes a kernel-side LLM call
# should not grow one, and worker_llm imports it lazily so every other verb
# still works without it. Install with `pip install "cs-kernel[llm]"`.
[project.optional-dependencies]
llm = ["anthropic>=0.107"]

[tool.setuptools.packages.find]
include = ["cs*"]

# Ship Jinja project templates with the package (cs init / cs update).
# NOTE: `**/*` does NOT match dot-prefixed files/dirs, so the hidden templates
# (.claude/, .env.example.j2, .gitignore.j2) must be listed explicitly — without
# them a stamped clone is missing its skills/commands/settings + .env/.gitignore.
[tool.setuptools.package-data]
cs = [
    "templates/project/**/*",
    "templates/project/.*",
    "templates/project/.claude/**/*",
]
